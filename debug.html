<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug API Endpoints</h1>
    
    <div class="section">
        <h2>Users</h2>
        <button onclick="getAllUsers()">Get All Users</button>
        <div id="usersResult"></div>
    </div>
    
    <div class="section">
        <h2>Posts</h2>
        <button onclick="getAllPosts()">Get All Posts</button>
        <div id="postsResult"></div>
    </div>
    
    <div class="section">
        <h2>Test Timeline</h2>
        <input type="text" id="userId" placeholder="Enter User ID" style="width: 300px;">
        <button onclick="testTimeline()">Test Timeline</button>
        <div id="timelineResult"></div>
    </div>

    <script>
        async function getAllUsers() {
            try {
                const response = await fetch('http://localhost:8800/api/users/all');
                const data = await response.json();
                document.getElementById('usersResult').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('usersResult').innerHTML = '<pre>Error: ' + error.message + '</pre>';
            }
        }

        async function getAllPosts() {
            try {
                const response = await fetch('http://localhost:8800/api/post/all');
                const data = await response.json();
                document.getElementById('postsResult').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('postsResult').innerHTML = '<pre>Error: ' + error.message + '</pre>';
            }
        }

        async function testTimeline() {
            const userId = document.getElementById('userId').value;
            if (!userId) {
                alert('Please enter a user ID');
                return;
            }
            
            try {
                const response = await fetch(`http://localhost:8800/api/post/timeline/${userId}`);
                const data = await response.json();
                document.getElementById('timelineResult').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('timelineResult').innerHTML = '<pre>Error: ' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
